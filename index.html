<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Symitrique</title>
<style>
:root{
  --bg:#f2f2f2; --card:#ffffff; --text:#0a0a0a; --muted:#707070; --line:#e3e3e3;
  --field:#f7f7f7; --red:#d90429; --red-dark:#a80320; --shadow:0 8px 24px rgba(0,0,0,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#111111; --text:#ffffff; --muted:#9b9b9b; --line:#262626;
    --field:#0a0a0a; --shadow:0 8px 24px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#111111; --text:#ffffff; --muted:#9b9b9b; --line:#262626;
  --field:#0a0a0a; --shadow:0 8px 24px rgba(0,0,0,.6);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.4;
}

/* Bandeau noir */
.top{
  background:#000; color:#fff; padding:30px 20px 64px;
  border-bottom:4px solid var(--red);
}
.brand{ max-width:560px; margin:0 auto; display:flex; align-items:center; gap:14px; }
.mark{
  width:54px; height:54px; border-radius:14px; background:var(--red); color:#fff;
  display:grid; place-items:center; font-size:30px; font-weight:900;
  box-shadow:0 0 0 4px rgba(217,4,41,.25);
}
h1{ margin:0; font-size:28px; font-weight:800; letter-spacing:.4px; }
.brand p{ margin:2px 0 0; color:#b5b5b5; font-size:14px; }

.wrap{ max-width:560px; margin:-40px auto 0; padding:0 16px 32px; }
.card{ background:var(--card); border-radius:18px; padding:20px; box-shadow:var(--shadow); border:1px solid var(--line); }
h2{ margin:0 0 16px; font-size:17px; font-weight:700; }

.grid{ display:grid; grid-template-columns:1fr 1.3fr 1.3fr; gap:10px; }
label{ display:block; font-size:13px; font-weight:600; margin-bottom:7px; }
input{
  width:100%; height:56px; padding:0 8px; text-align:center;
  font-size:22px; font-weight:700; color:var(--text); background:var(--field);
  border:2px solid var(--line); border-radius:12px; outline:none; -moz-appearance:textfield;
  transition:border-color .15s, box-shadow .15s;
}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input:focus{ border-color:var(--red); box-shadow:0 0 0 4px rgba(217,4,41,.15); }
.fixed,.fixed:focus{ background:var(--line); color:var(--muted); border-color:var(--line); box-shadow:none; cursor:not-allowed; }
small{ display:block; color:var(--muted); font-size:11px; margin-top:7px; }

.row{ display:flex; gap:10px; margin-top:20px; }
button{
  font:inherit; font-size:16px; font-weight:700; height:54px; padding:0 22px;
  border-radius:12px; cursor:pointer; border:2px solid transparent;
  transition:transform .1s, background .15s;
}
button:active{ transform:scale(.97); }
button:focus-visible{ outline:3px solid var(--red); outline-offset:2px; }
.primary{ flex:1; background:var(--red); color:#fff; }
.primary:hover{ background:var(--red-dark); }
.ghost{ background:transparent; color:var(--text); border-color:var(--line); }
.ghost:hover{ border-color:var(--text); }
.err{ display:none; margin-top:14px; padding:10px 12px; border-radius:10px; background:rgba(217,4,41,.1); color:var(--red); font-size:14px; font-weight:600; }

/* Résultat */
#resultCard{ display:none; margin-top:16px; }
.hero{
  background:linear-gradient(160deg,#000 0%,#1c0107 100%); color:#fff;
  border-radius:18px; padding:26px 18px 22px; text-align:center;
  border-top:5px solid var(--red); box-shadow:var(--shadow);
}
.lbl{ font-size:14px; color:#b5b5b5; }
.res{
  font-size:clamp(38px,12vw,60px); font-weight:900; margin:8px 0 20px;
  letter-spacing:1px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere;
}
.chips{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
.chip{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px 4px; }
.chip b{ display:block; font-size:28px; font-weight:800; color:var(--red); line-height:1.1; }
.chip span{ font-size:13px; color:#d0d0d0; }
.copy{ width:100%; background:#fff; color:#000; height:50px; }
.copy:hover{ background:#e8e8e8; }
.hero.pop{ animation:pop .3s ease-out; }
@keyframes pop{ from{ transform:translateY(8px) scale(.98); opacity:.3; } to{ transform:none; opacity:1; } }

footer{ text-align:center; color:var(--muted); font-size:12px; padding:24px 0 0; }
#toast{
  position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(20px); background:var(--red); color:#fff;
  padding:11px 20px; border-radius:999px; font-weight:700; font-size:14px;
  opacity:0; pointer-events:none; transition:.2s; box-shadow:var(--shadow);
}
#toast.show{ opacity:1; transform:translateX(-50%); }
@media (max-width:380px){ .grid{ gap:6px; } input{ font-size:19px; } .card{ padding:16px; } }
@media (prefers-reduced-motion:reduce){ .hero.pop{ animation:none; } #toast,button,input{ transition:none; } button:active{ transform:none; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">S</div>
    <div>
      <h1>Symitrique</h1>
      <p>Calculateur de cartes</p>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2>Données</h2>
    <div class="grid">
      <div><label for="first">Premier</label><input id="first" class="fixed" type="text" value="0" readonly tabindex="-1" aria-readonly="true"><small>Fixe : 0</small></div>
      <div><label for="x">Carte (X)</label><input id="x" type="number" inputmode="numeric" placeholder="15" min="1" step="1"><small>Position de la carte</small></div>
      <div><label for="y">Nombre (Y)</label><input id="y" type="number" inputmode="numeric" placeholder="10" min="0" step="1"><small>Valeur supplémentaire</small></div>
    </div>
    <div class="row">
      <button class="primary" onclick="calculate()">Calculer</button>
      <button class="ghost" onclick="resetApp()">Effacer</button>
    </div>
    <div class="err" id="error" role="alert"></div>
  </section>

  <section id="resultCard">
    <div class="hero">
      <div class="lbl">Résultat</div>
      <div class="res" id="finalResult">1/7-4-23</div>
      <div class="chips">
        <div class="chip"><b id="cTite"></b><span>Tite</span></div>
        <div class="chip"><b id="cDispo"></b><span>Dispo</span></div>
        <div class="chip"><b id="cReste"></b><span>Paire</span></div>
      </div>
      <button class="copy" onclick="copyResult()">Copier le résultat</button>
    </div>
  </section>

  <footer>Symitrique © 2026</footer>
</main>
<div id="toast" role="status"></div>

<script>
function $(id){ return document.getElementById(id); }

function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

function calculate(){
  var first = Number($("first").value);
  var xInput = $("x").value;
  var yInput = $("y").value;
  var error = $("error");
  error.style.display = "none";

  if (xInput.trim()==="" || yInput.trim()==="" ||
      !Number.isInteger(first) || !Number.isInteger(Number(xInput)) || !Number.isInteger(Number(yInput)) ||
      first < 0 || Number(xInput) < 1 || Number(yInput) < 0){
    error.textContent = "Entrez des nombres entiers valides (X ≥ 1, Y ≥ 0).";
    error.style.display = "block";
    return;
  }

  var x = Number(xInput), y = Number(yInput);
  var passed = x - 1;
  var excluded = 0;
  if (passed >= 9) excluded++;
  if (passed >= 10) excluded++;
  var validCards = passed - excluded;
  var z = validCards * 64;
  var i = y + 1;
  var t = z + i;
  var tite = Math.floor(t / 112) + 1;
  var afterTite = t % 112;
  var dispo = Math.floor(afterTite / 28) + 1;
  var reste = afterTite % 28;

  $("finalResult").textContent = "1/" + tite + "-" + dispo + "-" + reste;
  $("cTite").textContent = tite;
  $("cDispo").textContent = dispo;
  $("cReste").textContent = reste;

  $("resultCard").style.display = "block";
  var h = document.querySelector(".hero");
  h.classList.remove("pop"); void h.offsetWidth; h.classList.add("pop");
  $("resultCard").scrollIntoView({ behavior:"smooth", block:"nearest" });
}

function resetApp(){
  $("first").value = 0; $("x").value = ""; $("y").value = "";
  $("resultCard").style.display = "none";
  $("error").style.display = "none";
}

function copyResult(){
  var result = $("finalResult").textContent;
  function fallback(){
    var a = document.createElement("textarea");
    a.value = result; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); toast("Copié : " + result); }
    catch(e){ toast("Copie impossible"); }
    a.remove();
  }
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(result).then(function(){ toast("Copié : " + result); }, fallback);
  } else { fallback(); }
}

document.querySelectorAll("input").forEach(function(el){
  el.addEventListener("keydown", function(e){ if (e.key === "Enter") calculate(); });
});
</script>
</body>
</html>
